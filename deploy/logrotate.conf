# ══════════════════════════════════════════════════════════════════════════════
#  Mido · logrotate configuration
#
#  Install (needs sudo):
#      sudo cp deploy/logrotate.conf /etc/logrotate.d/mido
#      sudo logrotate -d /etc/logrotate.d/mido     # dry run, check for errors
#
#  Without sudo you can still shrink the log manually:
#      : > /home/medo/Downloads/zz/ZThon/logs/mido.log
# ══════════════════════════════════════════════════════════════════════════════

/home/medo/Downloads/zz/ZThon/logs/*.log
/home/medo/Downloads/zz/ZThon/logs/*.txt {
    weekly
    rotate 4
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
    su medo medo
}
