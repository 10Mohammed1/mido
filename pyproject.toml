# ══════════════════════════════════════════════════════════════════════════════
#  Mido · project configuration
#
#  No packaging is required to run the bot (it is started with `python -m zira`),
#  this file only centralises the project metadata and the tooling config used
#  by linters / formatters so the code base stays consistent.
# ══════════════════════════════════════════════════════════════════════════════

[project]
name = "mido"
version = "3.3.2"
description = "Mido · Telegram userbot (Telethon based)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Mido" }]

dependencies = [
    "telethon>=1.45.0",
    "sqlalchemy>=2.0",
    "aiohttp>=3.9",
    "motor>=3.3",
    "requests>=2.31",
    "python-dotenv>=1.0",
    "emoji>=2.0",
    "pillow>=10.0",
    "yt-dlp>=2024.1.1",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
]

# ── code style ────────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 120
target-version = "py310"
exclude = ["zedthon", "bin", "**/__pycache__"]

[tool.ruff.lint]
# F = pyflakes, E/W = pycodestyle, I = import order, UP = pyupgrade,
# B = bugbear, ASYNC = asyncio mistakes, RUF = ruff specifics
select = ["F", "E4", "E7", "E9", "W6", "I", "UP", "B", "ASYNC", "RUF"]
ignore = [
    "E402",   # module level import not at top of file (conditional imports)
    "E722",   # bare except — already cleaned up, kept for legacy plugins
    "F401",   # unused import (many re-exports)
    "F403",   # star imports
    "F405",   # may be undefined from star imports
    "RUF001", # ambiguous unicode character in string (arabic/emoji help texts)
    "RUF002",
    "RUF003",
    "UP031",  # printf style formatting
]

[tool.ruff.lint.per-file-ignores]
"zira/plugins/*" = ["E501", "B008"]
"zira/helpers/*" = ["B008"]

[tool.ruff.format]
quote-style = "double"

# ── typing (optional, informational only) ─────────────────────────────────────
[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
follow_imports = "silent"
warn_unused_ignores = false

[tool.black]
line-length = 120
target-version = ["py310"]
