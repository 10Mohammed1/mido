name: Lint

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ruff
        run: pip install ruff

      # Read-only check on purpose: CI reports problems, it never rewrites
      # the repository behind your back.
      - name: Check syntax / imports / obvious bugs
        run: ruff check . --statistics
        continue-on-error: true

      - name: Check formatting
        run: ruff format --check .
        continue-on-error: true
